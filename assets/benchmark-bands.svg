<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 364" width="800" height="364" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">How 1,896 audited sites split across the GEO score bands</title>
<desc id="d">critical 12.4% (235); foundation 57.6% (1092); good 28.2% (534); excellent 1.8% (35). Latest audit per domain on 17 October 2026; scores from engine 4.13 to 4.19, rubric v1 up to 4.18 and rubric v2 from 4.19; self-selected sample.</desc>
<rect width="800" height="364" rx="10" fill="#F6F5F1" stroke="#D9D7CF"/>
<text x="40" y="38" font-size="20" font-weight="700" fill="#17201f">How 1,896 audited sites split across the score bands</text>
<text x="40" y="60" font-size="13" fill="#4a5654">Share of sites per band, one latest audit per domain</text>
<text x="40" y="92" font-size="14" fill="#17201f">Critical <tspan fill="#4a5654">0–35</tspan></text><text x="760" y="92" text-anchor="end" font-size="14" font-weight="700" fill="#17201f">12.4% <tspan font-weight="400" fill="#4a5654">· 235 sites</tspan></text><rect x="40" y="100" width="720" height="16" rx="3" fill="#E4E7E6"/><rect x="40" y="100" width="89.2" height="16" rx="3" fill="#F4C7C3" stroke="#9aa5a2" stroke-width="0.5"/><text x="40" y="142" font-size="14" fill="#17201f">Foundation <tspan fill="#4a5654">36–67</tspan></text><text x="760" y="142" text-anchor="end" font-size="14" font-weight="700" fill="#17201f">57.6% <tspan font-weight="400" fill="#4a5654">· 1,092 sites</tspan></text><rect x="40" y="150" width="720" height="16" rx="3" fill="#E4E7E6"/><rect x="40" y="150" width="414.7" height="16" rx="3" fill="#F7E1A8" stroke="#9aa5a2" stroke-width="0.5"/><text x="40" y="192" font-size="14" fill="#17201f">Good <tspan fill="#4a5654">68–85</tspan></text><text x="760" y="192" text-anchor="end" font-size="14" font-weight="700" fill="#17201f">28.2% <tspan font-weight="400" fill="#4a5654">· 534 sites</tspan></text><rect x="40" y="200" width="720" height="16" rx="3" fill="#E4E7E6"/><rect x="40" y="200" width="202.8" height="16" rx="3" fill="#BFE6E1" stroke="#9aa5a2" stroke-width="0.5"/><text x="40" y="242" font-size="14" fill="#17201f">Excellent <tspan fill="#4a5654">86–100</tspan></text><text x="760" y="242" text-anchor="end" font-size="14" font-weight="700" fill="#17201f">1.8% <tspan font-weight="400" fill="#4a5654">· 35 sites</tspan></text><rect x="40" y="250" width="720" height="16" rx="3" fill="#E4E7E6"/><rect x="40" y="250" width="13.3" height="16" rx="3" fill="#7CCFC5" stroke="#9aa5a2" stroke-width="0.5"/>
