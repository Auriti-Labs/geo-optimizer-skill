# GitHub Action Composita per GEO Optimizer Skill
# Esegue un audit GEO completo su qualsiasi URL direttamente nella CI/CD pipeline.
#
# Utilizzo (sostituire <tag> con l'ultima release, es. v4.30.2):
#   - uses: Auriti-Labs/geo-optimizer-skill@<tag>
#     with:
#       url: https://mysite.com
#       min-score: 70
#       format: sarif
#
# Sicurezza: gli input NON vengono mai interpolati nello script shell. Passano
# da variabili d'ambiente e vengono validati prima dell'uso.

name: "GEO Optimizer Audit"
description: "Run a full GEO audit on any URL and get a citability score (0-100) for AI search engines."
author: "Auriti Labs"

branding:
  icon: "search"
  color: "blue"

inputs:
  url:
    description: "URL to audit"
    required: true
  min-score:
    description: "Preferred minimum score (0-100). The step fails if the score is below this value."
    required: false
    default: "0"
  threshold:
    description: "Deprecated alias for min-score."
    required: false
    default: "0"
  format:
    description: "Output format: json, sarif, junit, text"
    required: false
    default: "json"
  output-file:
    description: "Base name for the output file (without extension)"
    required: false
    default: "geo-report"
  fail-on-warning:
    description: "Shortcut for max-recommendations: 0. Fail the step when the audit returns any recommendation."
    required: false
    default: "false"
  max-recommendations:
    description: "Fail the step when the audit returns more than this many recommendations. 0 disables the check (unless fail-on-warning is true)."
    required: false
    default: "0"
  version:
    description: "geo-optimizer-skill version to install (e.g. 4.30.2). Default: latest."
    required: false
    default: ""

outputs:
  score:
    description: "GEO citability score (0-100)"
    value: ${{ steps.extract.outputs.score }}
  band:
    description: "Score band: critical, foundation, good, or excellent"
    value: ${{ steps.extract.outputs.band }}
  report-path:
    description: "Path to the generated report file"
    value: ${{ steps.audit.outputs.report_path }}

runs:
  using: "composite"
  steps:
    # 1. Valida gli input prima di usarli
    - name: Validate inputs
      shell: bash
      env:
        IN_FORMAT: ${{ inputs.format }}
        IN_OUTPUT_FILE: ${{ inputs.output-file }}
        IN_MIN_SCORE: ${{ inputs.min-score }}
        IN_THRESHOLD: ${{ inputs.threshold }}
        IN_MAX_RECS: ${{ inputs.max-recommendations }}
        IN_VERSION: ${{ inputs.version }}
      run: |
        case "$IN_FORMAT" in
          json|sarif|junit|text) ;;
          *) echo "::error::Invalid format '$IN_FORMAT'. Use json, sarif, junit or text."; exit 1 ;;
        esac
        if ! printf '%s' "$IN_OUTPUT_FILE" | grep -qE '^[A-Za-z0-9._-]+$'; then
          echo "::error::Invalid output-file '$IN_OUTPUT_FILE'. Use letters, digits, dot, dash and underscore only."
          exit 1
        fi
        for v in "$IN_MIN_SCORE" "$IN_THRESHOLD"; do
          if ! printf '%s' "$v" | grep -qE '^[0-9]{1,3}$'; then
            echo "::error::min-score and threshold must be integers between 0 and 100 (got '$v')."
            exit 1
          fi
        done
        if ! printf '%s' "$IN_MAX_RECS" | grep -qE '^[0-9]{1,4}$'; then
          echo "::error::max-recommendations must be a non-negative integer (got '$IN_MAX_RECS')."
          exit 1
        fi
        if [ -n "$IN_VERSION" ] && ! printf '%s' "$IN_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+[a-z0-9.]*$'; then
          echo "::error::Invalid version '$IN_VERSION'. Expected X.Y.Z[suffix]."
          exit 1
        fi

    # 2. Setup Python
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    # 3. Installa geo-optimizer-skill (versione fissata se richiesta)
    - name: Install geo-optimizer-skill
      shell: bash
      env:
        IN_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$IN_VERSION" ]; then
          pip install "geo-optimizer-skill==$IN_VERSION"
        else
          pip install geo-optimizer-skill
        fi

    # 4. Determina estensione del file in base al formato
    - name: Determine file extension
      id: ext
      shell: bash
      env:
        IN_FORMAT: ${{ inputs.format }}
      run: |
        case "$IN_FORMAT" in
          sarif) echo "ext=sarif" >> "$GITHUB_OUTPUT" ;;
          junit) echo "ext=xml" >> "$GITHUB_OUTPUT" ;;
          text)  echo "ext=txt" >> "$GITHUB_OUTPUT" ;;
          *)     echo "ext=json" >> "$GITHUB_OUTPUT" ;;
        esac

    # 5. Esegui l'audit GEO
    - name: Run GEO audit
      id: audit
      shell: bash
      env:
        IN_URL: ${{ inputs.url }}
        IN_FORMAT: ${{ inputs.format }}
        IN_OUTPUT_FILE: ${{ inputs.output-file }}
        IN_EXT: ${{ steps.ext.outputs.ext }}
      run: |
        REPORT_PATH="${IN_OUTPUT_FILE}.${IN_EXT}"
        echo "report_path=${REPORT_PATH}" >> "$GITHUB_OUTPUT"

        # Genera sempre JSON prima (singolo audit), poi converti se serve
        geo audit --url "$IN_URL" --format json --output geo-score-tmp.json

        # Se il formato richiesto non e JSON, genera anche il report nel formato voluto
        if [ "$IN_FORMAT" != "json" ]; then
          geo audit --url "$IN_URL" --format "$IN_FORMAT" --output "$REPORT_PATH" --cache
        else
          cp geo-score-tmp.json "$REPORT_PATH"
        fi

    # 6. Estrai score e band dal JSON (il file temporaneo resta fino al passo finale)
    - name: Extract score and band
      id: extract
      shell: bash
      run: |
        SCORE=$(python3 -c "import json; d=json.load(open('geo-score-tmp.json')); print(d.get('score', 0))")
        BAND=$(python3 -c "import json; d=json.load(open('geo-score-tmp.json')); print(d.get('band', 'critical'))")
        echo "score=${SCORE}" >> "$GITHUB_OUTPUT"
        echo "band=${BAND}" >> "$GITHUB_OUTPUT"
        echo "::notice::GEO Score: ${SCORE}/100 (${BAND})"

    # 7. Upload SARIF (solo se formato sarif)
    - name: Upload SARIF results
      if: inputs.format == 'sarif'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.audit.outputs.report_path }}
      continue-on-error: true

    # 8. Controlla soglia score (confronto numerico anche con punteggi decimali)
    - name: Check score threshold
      shell: bash
      env:
        GEO_SCORE: ${{ steps.extract.outputs.score }}
        IN_MIN_SCORE: ${{ inputs.min-score }}
        IN_THRESHOLD: ${{ inputs.threshold }}
      run: |
        MIN_SCORE="$IN_MIN_SCORE"
        if [ "$MIN_SCORE" = "0" ] && [ "$IN_THRESHOLD" != "0" ]; then
          MIN_SCORE="$IN_THRESHOLD"
        fi
        if [ "$MIN_SCORE" = "0" ]; then
          exit 0
        fi
        if python3 -c "import sys; sys.exit(0 if float(sys.argv[1]) < float(sys.argv[2]) else 1)" "$GEO_SCORE" "$MIN_SCORE"; then
          echo "::error::GEO score ${GEO_SCORE} is below minimum score ${MIN_SCORE}"
          exit 1
        fi
        echo "✅ GEO score ${GEO_SCORE} meets minimum score ${MIN_SCORE}"

    # 9. Fallisce se le raccomandazioni superano il limite (se abilitato)
    - name: Check recommendations
      if: inputs.fail-on-warning == 'true' || inputs.max-recommendations != '0'
      shell: bash
      env:
        IN_MAX_RECS: ${{ inputs.max-recommendations }}
      run: |
        COUNT=$(python3 -c "import json; d=json.load(open('geo-score-tmp.json')); print(len(d.get('recommendations', [])))")
        # Con fail-on-warning senza limite esplicito il limite e 0 (nessuna raccomandazione)
        LIMIT="$IN_MAX_RECS"
        if [ "$COUNT" -gt "$LIMIT" ]; then
          echo "::error::Found ${COUNT} recommendations, more than the allowed ${LIMIT}"
          exit 1
        fi
        echo "✅ ${COUNT} recommendations (allowed: ${LIMIT})"

    # 10. Pulizia del file temporaneo, anche se un passo precedente e fallito
    - name: Remove temporary file
      if: always()
      shell: bash
      run: rm -f geo-score-tmp.json
