name: Publish to PyPI

on:
  push:
    tags: ['v*']

jobs:
  # Job ci: esegue i test prima di qualsiasi pubblicazione
  ci:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Esegui test suite
        run: pytest tests/ -v --tb=short

  build:
    name: Build distribution
    needs: [ci]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Check the tag matches the pyproject version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches pyproject.toml version ${version}"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Check the built archives
        run: python scripts/check_dist.py dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  # Job smoke: installa gli archivi appena costruiti in venv pulite, fuori dal checkout
  smoke:
    name: Smoke-install the built archives
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Install the wheel and the sdist in clean venvs
        shell: bash
        run: |
          set -euo pipefail
          wheels=("$PWD"/dist/*.whl)
          sdists=("$PWD"/dist/*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel and one sdist in dist/"
            ls -l dist/
            exit 1
          fi
          wheel="${wheels[0]}"
          sdist="${sdists[0]}"
          cd "$RUNNER_TEMP"

          # base: the wheel alone, the CLI entry point must start
          python -m venv venv-base
          venv-base/bin/pip install --quiet "$wheel"
          venv-base/bin/geo --version

          # sdist: built from source once, same check
          python -m venv venv-sdist
          venv-sdist/bin/pip install --quiet "$sdist"
          venv-sdist/bin/geo --version

          # web extra: the geo-web entry point and the FastAPI app it serves
          python -m venv venv-web
          venv-web/bin/pip install --quiet "${wheel}[web]"
          venv-web/bin/python -c "import geo_optimizer.web.cli, geo_optimizer.web.app; print('web ok', geo_optimizer.web.app.app.title)"
          venv-web/bin/geo-web --help > /dev/null

          # mcp extra: the geo-mcp entry point module (imports mcp.server.fastmcp)
          python -m venv venv-mcp
          venv-mcp/bin/pip install --quiet "${wheel}[mcp]"
          venv-mcp/bin/python -c "from geo_optimizer.mcp.server import main, mcp; print('mcp ok', mcp.name)"

  publish:
    name: Publish to PyPI
    needs: [ci, build, smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/geo-optimizer-skill
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Pubblica su PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 (v1.14.3)
        with:
          skip-existing: true
