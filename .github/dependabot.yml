version: 2
updates:
  # Aggiornamenti dipendenze Python
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"

  # Aggiornamenti GitHub Actions
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/geo-audit"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
